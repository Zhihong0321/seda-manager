<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDA Mapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8C00;
            --secondary: #1E3A8A;
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text-dim: #94A3B8;
            --accent: #38BDF8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            width: 320px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #ffffff1a;
            padding-bottom: 12px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #FFD700);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background: var(--card);
            border: 1px solid #ffffff1a;
            border-radius: 8px;
            padding: 10px 12px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 140, 0, 0.2);
        }

        button {
            background: linear-gradient(to right, var(--primary), #FF6B00);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 12px;
            background: rgba(56, 189, 248, 0.1);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #EF4444;
            color: #FCA5A5;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.1);
            border-left-color: #22C55E;
            color: #86EFAC;
        }

        .data-preview {
            background: var(--card);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ffffff0d;
            display: none;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #ffffff08;
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            color: var(--text-dim);
        }

        footer {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">S</div>
            <h1>SEDA Mapper</h1>
        </header>

        <div class="input-group">
            <label for="app-id">Application / Profile ID</label>
            <input type="text" id="app-id" placeholder="Enter ID (e.g. 4088)">
        </div>

        <button id="fetch-btn">
            <span>Fetch from System</span>
        </button>

        <div id="data-preview" class="data-preview">
            <!-- Data items will be injected here -->
        </div>

        <button id="fill-btn" disabled>
            <span>Map & Fill Form</span>
        </button>

        <div id="status" class="status"></div>

        <footer>
            Connected to: https://seda-manager-production.up.railway.app
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
